<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子白板飛鏢對戰</title>
  <!-- 載入 React, ReactDOM, Babel 與 Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="bg-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- 圖示元件 (取代原本的 lucide-react) ---
    const Target = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const Users = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const Play = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="6 3 20 12 6 21 6 3"/></svg>;
    const RotateCcw = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const Undo2 = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>;
    const Trophy = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
    const Volume2 = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
    const VolumeX = (p) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;

    // 定義靶面各區塊的分數與外觀
    const RINGS = [
      { points: 50, radius: 40, fill: '#ef4444', textFill: '#ffffff', textY: 300, multFill: null },
      { points: 20, radius: 90, fill: '#f59e0b', textFill: '#000000', textY: 235, multFill: '#dc2626' },
      { points: 15, radius: 140, fill: '#3b82f6', textFill: '#ffffff', textY: 185, multFill: '#f97316' },
      { points: 10, radius: 190, fill: '#22c55e', textFill: '#ffffff', textY: 135, multFill: '#dc2626' },
      { points: 5, radius: 240, fill: '#ffffff', textFill: '#000000', textY: 85, multFill: '#16a34a' },
      { points: 1, radius: 290, fill: '#1f2937', textFill: '#ffffff', textY: 35, multFill: '#dc2626' }
    ];

    // --- Web Audio API 音效合成系統 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const playSound = (type) => {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      switch (type) {
        case 'bullseye': // 50分
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(523.25, now);
          oscillator.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          oscillator.start(now);
          oscillator.stop(now + 0.5);
          break;
        case 'double': // 兩倍分數音效
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(1046.50, now);
          oscillator.frequency.exponentialRampToValueAtTime(2093, now + 0.1);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.5, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          oscillator.start(now);
          oscillator.stop(now + 0.4);
          break;
        case 'high': // 20, 15分
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(880, now); 
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.4, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          oscillator.start(now);
          oscillator.stop(now + 0.3);
          break;
        case 'mid': // 10, 5, 1分
          oscillator.type = 'square';
          oscillator.frequency.setValueAtTime(150, now);
          oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          oscillator.start(now);
          oscillator.stop(now + 0.15);
          break;
        case 'miss': // 0分脫靶
          oscillator.type = 'sawtooth';
          oscillator.frequency.setValueAtTime(100, now);
          oscillator.frequency.linearRampToValueAtTime(50, now + 0.3);
          gainNode.gain.setValueAtTime(0.3, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          oscillator.start(now);
          oscillator.stop(now + 0.3);
          break;
        case 'bust': // 爆鏢
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(300, now);
          oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.5);
          gainNode.gain.setValueAtTime(0.5, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          oscillator.start(now);
          oscillator.stop(now + 0.8);
          break;
        case 'win': // 獲勝
          const freqs = [523.25, 659.25, 783.99, 1046.50]; 
          freqs.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            const time = now + i * 0.15;
            g.gain.setValueAtTime(0, time);
            g.gain.linearRampToValueAtTime(0.4, time + 0.05);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
            osc.start(time);
            osc.stop(time + 0.5);
          });
          break;
      }
    };

    function App() {
      const [gameState, setGameState] = useState('setup'); 
      const [numPlayers, setNumPlayers] = useState(2);
      const [startingScore, setStartingScore] = useState(301);
      const [soundEnabled, setSoundEnabled] = useState(true);

      const [players, setPlayers] = useState([]);
      const [activePlayerIndex, setActivePlayerIndex] = useState(0);
      const [turnStartScore, setTurnStartScore] = useState(0);
      const [turnDarts, setTurnDarts] = useState([]);
      const [turnMessage, setTurnMessage] = useState('');
      const [winner, setWinner] = useState(null);
      const [multipliers, setMultipliers] = useState({});

      const svgRef = useRef(null);
      const lastThrowTime = useRef(0); 

      useEffect(() => {
        generateMultipliers();
      }, []);

      const generateMultipliers = () => {
        const newMultipliers = {};
        RINGS.forEach(r => {
          if (r.points !== 50) newMultipliers[r.points] = Math.floor(Math.random() * 12);
        });
        setMultipliers(newMultipliers);
      };

      const startGame = () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        generateMultipliers(); 
        
        const newPlayers = Array.from({ length: numPlayers }, (_, i) => ({
          id: i, name: `玩家 ${i + 1}`, score: startingScore
        }));
        setPlayers(newPlayers);
        setActivePlayerIndex(0);
        setTurnStartScore(startingScore);
        setTurnDarts([]);
        setTurnMessage('');
        setWinner(null);
        setGameState('playing');
      };

      const playScoreSound = (points, isDouble) => {
        if (!soundEnabled) return;
        if (isDouble) playSound('double');
        else if (points === 50) playSound('bullseye');
        else if (points >= 15) playSound('high');
        else if (points > 0) playSound('mid');
        else playSound('miss');
      };

      const handleBoardClick = (e) => {
        e.preventDefault(); 
        if (gameState !== 'playing' || turnMessage !== '') return;

        const now = Date.now();
        if (now - lastThrowTime.current < 3000) return; 
        lastThrowTime.current = now;

        const svg = svgRef.current;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const { x, y } = pt.matrixTransform(svg.getScreenCTM().inverse());

        const dx = x - 300;
        const dy = y - 300;
        const distance = Math.sqrt(dx * dx + dy * dy);

        let angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        angleDeg = (angleDeg + 90) % 360;
        if (angleDeg < 0) angleDeg += 360;
        const segmentHit = Math.floor(angleDeg / 30); 

        let points = 0;
        let isDouble = false;

        for (let ring of RINGS) {
          if (distance <= ring.radius) {
            points = ring.points;
            if (ring.points !== 50 && multipliers[ring.points] === segmentHit) {
              isDouble = true;
              points *= 2;
            }
            break;
          }
        }

        playScoreSound(points, isDouble);
        processThrow(points, { x, y }, isDouble);
      };

      const processThrow = (points, pos, isDouble) => {
        const newDarts = [...turnDarts, { points, pos, isDouble }];
        setTurnDarts(newDarts);

        const currentTotal = newDarts.reduce((sum, d) => sum + d.points, 0);
        const tentativeScore = turnStartScore - currentTotal;

        if (tentativeScore < 0) {
          setTurnMessage('爆鏢 (Bust)!');
          if (soundEnabled) setTimeout(() => playSound('bust'), 300);
          setTimeout(() => endTurn(turnStartScore), 2000);
        } else if (tentativeScore === 0) {
          setTurnMessage('獲勝！');
          if (soundEnabled) setTimeout(() => playSound('win'), 300);
          const updatedPlayers = [...players];
          updatedPlayers[activePlayerIndex].score = 0;
          setPlayers(updatedPlayers);
          setWinner(updatedPlayers[activePlayerIndex]);
          setGameState('over');
        } else if (newDarts.length === 3) {
          setTurnMessage('換下一位');
          setTimeout(() => endTurn(tentativeScore), 1500);
        }
      };

      const endTurn = (finalScoreForActivePlayer) => {
        const updatedPlayers = [...players];
        updatedPlayers[activePlayerIndex].score = finalScoreForActivePlayer;
        setPlayers(updatedPlayers);
        const nextPlayerIdx = (activePlayerIndex + 1) % numPlayers;
        setActivePlayerIndex(nextPlayerIdx);
        setTurnStartScore(updatedPlayers[nextPlayerIdx].score);
        setTurnDarts([]);
        setTurnMessage('');
      };

      const undoLastDart = () => {
        if (turnDarts.length === 0 || turnMessage) return;
        setTurnDarts(prev => prev.slice(0, -1));
      };

      const resetGame = () => setGameState('setup');

      const getWedgePath = (radius, segmentIndex) => {
        const startAngle = (segmentIndex * 30 - 90) * (Math.PI / 180);
        const endAngle = ((segmentIndex + 1) * 30 - 90) * (Math.PI / 180);
        const startX = 300 + radius * Math.cos(startAngle);
        const startY = 300 + radius * Math.sin(startAngle);
        const endX = 300 + radius * Math.cos(endAngle);
        const endY = 300 + radius * Math.sin(endAngle);
        return `M 300 300 L ${startX} ${startY} A ${radius} ${radius} 0 0 1 ${endX} ${endY} Z`;
      };

      const getWedgeTextPos = (radius, segmentIndex) => {
        const midRadius = radius - 25; 
        const midAngle = (segmentIndex * 30 - 75) * (Math.PI / 180);
        return { x: 300 + midRadius * Math.cos(midAngle), y: 300 + midRadius * Math.sin(midAngle) };
      };

      if (gameState === 'setup') {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center font-sans p-4" onContextMenu={(e) => e.preventDefault()}>
            <div className="bg-white rounded-3xl shadow-2xl p-10 max-w-2xl w-full text-center relative">
              <button onClick={() => setSoundEnabled(!soundEnabled)} className="absolute top-6 right-6 p-3 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition-colors">
                {soundEnabled ? <Volume2 className="w-8 h-8" /> : <VolumeX className="w-8 h-8" />}
              </button>
              <Target className="w-24 h-24 text-red-500 mx-auto mb-6" />
              <h1 className="text-5xl font-extrabold text-slate-800 mb-10">電子白板飛鏢對戰</h1>
              <div className="mb-10">
                <h2 className="text-2xl font-bold text-slate-600 mb-4 flex items-center justify-center gap-2">
                  <Users className="w-8 h-8" /> 選擇遊玩人數
                </h2>
                <div className="flex justify-center gap-4">
                  {[1, 2, 3].map(num => (
                    <button key={num} onClick={() => setNumPlayers(num)} className={`w-24 h-24 text-4xl font-bold rounded-2xl transition-all ${numPlayers === num ? 'bg-blue-600 text-white shadow-lg scale-110' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}>
                      {num}
                    </button>
                  ))}
                </div>
              </div>
              <div className="mb-12">
                <h2 className="text-2xl font-bold text-slate-600 mb-4 flex items-center justify-center gap-2">
                  <Target className="w-8 h-8" /> 選擇起始分數
                </h2>
                <div className="flex justify-center gap-6">
                  {[301, 501].map(score => (
                    <button key={score} onClick={() => setStartingScore(score)} className={`px-8 py-4 text-4xl font-bold rounded-2xl transition-all ${startingScore === score ? 'bg-green-600 text-white shadow-lg scale-110' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}>
                      {score}
                    </button>
                  ))}
                </div>
              </div>
              <button onClick={startGame} className="w-full py-6 bg-red-600 hover:bg-red-700 text-white text-4xl font-black rounded-2xl shadow-xl flex items-center justify-center gap-4 transition-transform active:scale-95">
                <Play className="w-10 h-10" /> 開始對戰
              </button>
            </div>
          </div>
        );
      }

      const currentTotalDarts = turnDarts.reduce((sum, d) => sum + d.points, 0);
      const currentDisplayScore = turnStartScore - currentTotalDarts;

      return (
        <div className="min-h-screen bg-slate-900 text-white flex flex-col md:flex-row font-sans overflow-hidden" onContextMenu={(e) => e.preventDefault()}>
          <div className="w-full md:w-1/3 bg-slate-800 p-6 flex flex-col shadow-2xl z-10 border-r border-slate-700">
            <div className="flex items-center justify-between mb-8">
              <h2 className="text-3xl font-black text-slate-200 flex items-center gap-3">
                <Target className="text-red-500 w-8 h-8" /> 01 賽制 ({startingScore})
              </h2>
              <div className="flex gap-3">
                 <button onClick={() => setSoundEnabled(!soundEnabled)} className="p-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-colors">
                  {soundEnabled ? <Volume2 className="w-8 h-8 text-green-400" /> : <VolumeX className="w-8 h-8 text-red-400" />}
                </button>
                <button onClick={resetGame} className="p-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-colors">
                  <RotateCcw className="w-8 h-8 text-white" />
                </button>
              </div>
            </div>

            <div className="flex-1 flex flex-col gap-4">
              {players.map((player, idx) => {
                const isActive = idx === activePlayerIndex;
                const displayScore = isActive ? currentDisplayScore : player.score;
                return (
                  <div key={player.id} className={`relative p-6 rounded-3xl border-4 transition-all duration-300 ${isActive ? 'bg-blue-600 border-blue-400 shadow-[0_0_30px_rgba(59,130,246,0.5)] scale-[1.02]' : 'bg-slate-700 border-slate-600 opacity-70'}`}>
                    {isActive && <div className="absolute -top-4 -right-4 bg-yellow-400 text-yellow-900 text-xl font-black px-4 py-1 rounded-full shadow-lg animate-bounce">本回合</div>}
                    <h3 className="text-3xl font-bold mb-2">{player.name}</h3>
                    <div className="text-7xl font-black text-right tracking-tighter">{displayScore}</div>
                  </div>
                );
              })}
            </div>

            <div className="mt-8 bg-slate-700 rounded-3xl p-6">
              <h4 className="text-xl font-bold text-slate-400 mb-4 text-center">本回合飛鏢</h4>
              <div className="flex justify-center gap-4 mb-6">
                {[0, 1, 2].map(i => {
                  const dart = turnDarts[i];
                  return (
                    <div key={i} className={`w-20 h-20 rounded-2xl flex flex-col items-center justify-center border-4 ${dart ? (dart.isDouble ? 'bg-yellow-100 border-yellow-400 text-yellow-700' : 'bg-white border-slate-300 text-slate-800') : 'bg-slate-800 border-slate-600 text-slate-600'}`}>
                      <span className="text-4xl font-black">{dart ? dart.points : '-'}</span>
                      {dart && dart.isDouble && <span className="text-[10px] font-bold tracking-widest mt-1">DOUBLE</span>}
                    </div>
                  )
                })}
              </div>
              <button onClick={undoLastDart} disabled={turnDarts.length === 0 || turnMessage !== ''} className="w-full py-4 bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-500 rounded-xl text-2xl font-bold flex items-center justify-center gap-3 transition-colors">
                <Undo2 className="w-8 h-8" /> 復原上一鏢
              </button>
            </div>
          </div>

          <div className="w-full md:w-2/3 p-4 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-900">
            {turnMessage && !winner && (
              <div className="absolute z-20 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white text-7xl font-black py-8 px-16 rounded-3xl border-8 border-red-500 shadow-2xl backdrop-blur-sm animate-pulse whitespace-nowrap">
                {turnMessage}
              </div>
            )}
            {winner && (
              <div className="absolute z-50 inset-0 bg-black/90 flex flex-col items-center justify-center backdrop-blur-md">
                <Trophy className="w-48 h-48 text-yellow-400 mb-8 animate-bounce" />
                <h2 className="text-8xl font-black text-white mb-6 text-center">{winner.name} <span className="text-yellow-400">獲勝！</span></h2>
                <button onClick={resetGame} className="mt-12 px-12 py-6 bg-blue-600 hover:bg-blue-700 text-4xl font-bold rounded-2xl shadow-xl flex items-center gap-4 transition-transform active:scale-95">
                  <RotateCcw className="w-10 h-10" /> 再玩一局
                </button>
              </div>
            )}

            <div className="relative max-w-[800px] w-full aspect-square shadow-2xl rounded-full bg-[#8B4513] border-[12px] border-[#5c2e0b]">
              <svg ref={svgRef} viewBox="0 0 600 600" className="w-full h-full cursor-crosshair touch-none select-none" onPointerDown={handleBoardClick}>
                <circle cx="300" cy="300" r="300" fill="#8B4513" />
                {RINGS.slice().reverse().map((ring) => {
                  const segIdx = multipliers[ring.points];
                  const hasMultiplier = ring.points !== 50 && segIdx !== undefined;
                  return (
                    <g key={`ring-${ring.points}`}>
                      <circle cx="300" cy="300" r={ring.radius} fill={ring.fill} stroke="#000000" strokeWidth="2" className="transition-opacity hover:opacity-90"/>
                      {hasMultiplier && (() => {
                        const pathStr = getWedgePath(ring.radius, segIdx);
                        const textPos = getWedgeTextPos(ring.radius, segIdx);
                        return (
                          <g>
                            <path d={pathStr} fill={ring.multFill} stroke="#000000" strokeWidth="2" />
                            <text x={textPos.x} y={textPos.y} fill="#ffffff" fontSize="22" fontWeight="bold" textAnchor="middle" dominantBaseline="middle" className="pointer-events-none drop-shadow-md">{ring.points * 2}</text>
                          </g>
                        );
                      })()}
                      {ring.points !== 50 && segIdx !== 0 && (
                        <text x="300" y={ring.textY} fill={ring.textFill} fontSize="24" fontWeight="bold" textAnchor="middle" dominantBaseline="middle" className="pointer-events-none">{ring.points}</text>
                      )}
                    </g>
                  )
                })}
                <text x="300" y="300" fill="#ffffff" fontSize="28" fontWeight="black" textAnchor="middle" dominantBaseline="middle" className="pointer-events-none">50</text>
                {turnDarts.map((dart, idx) => (
                  <g key={idx} transform={`translate(${dart.pos.x}, ${dart.pos.y})`} className="pointer-events-none">
                    <circle cx="-3" cy="3" r="10" fill="rgba(0,0,0,0.4)" />
                    <circle cx="0" cy="0" r="12" fill={dart.isDouble ? "#facc15" : "#f87171"} stroke="#ffffff" strokeWidth="4" />
                    <circle cx="0" cy="0" r="4" fill="#000000" />
                    <text x="18" y="-18" fill="#ffffff" fontSize="20" fontWeight="bold" stroke="#000" strokeWidth="1" filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.8))">{idx + 1}</text>
                  </g>
                ))}
              </svg>
            </div>
            <p className="mt-8 text-2xl text-slate-400 font-bold tracking-widest bg-slate-800/50 px-8 py-3 rounded-full flex items-center gap-3">
              丟吧！中心在你心中 {soundEnabled || <span className="text-red-400 text-sm">(音效已關閉)</span>}
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
